paths:
  /api/users/:
    get:
      summary: Get all users
      tags:
        - Users
      responses:
        200:
          description: A list of users
          content:
            application/json:
              schema:
                type: Object
                properties:
                  status:
                    type: string
                    example: success
                    description: The status of the response
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        "404":
          description: No users found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                    description: The status of the response
                  error:
                    type: string
                    example: No users found
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                    description: The status of the response
                  error:
                    type: string
                    example: Internal Server Error
  /api/users/{uid}:
    get:
      summary: Get a user by ID
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: The ID of the user to retrieve
          schema:
            type: string
      responses:
        "200":
          description: A user object
          content:
            application/json:
              schema:
                type: Object
                properties:
                  status:
                    type: string
                    example: success
                    description: The status of the response
                  payload:
                    type: object
                    $ref: '#/components/schemas/User'
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                    description: The status of the response
                  error:
                    type: string
                    example: User not found
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                    description: The status of the response
                  error:
                    type: string
                    example: Internal Server Error
    patch:
      summary: Update a user by ID
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: The ID of the user to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  description: The first name of the user
                  example: John
                lastName:
                  type: string
                  description: The last name of the user
                  example: Doe
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                    description: The status of the response
                  payload:
                    type: string
                    example: User updated
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                    description: The status of the response
                  error:
                    type: string
                    example: User not found
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                    description: The status of the response
                  error:
                    type: string
                    example: Internal Server Error
    delete:
      summary: Delete a user by ID
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: The ID of the user to delete
          schema:
            type: string
      responses:
        "200":
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                    description: The status of the response
                  payload:
                    type: string
                    example: User deleted successfully
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                    description: The status of the response
                  error:
                    type: string
                    example: User not found
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                    description: The status of the response
                  error:
                    type: string
                    example: Internal Server Error
  /api/sessions/register:
    post:
      summary: Register a new user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                    description: The status of the response
                  payload:
                    type: string
                    example: 67bcb79f4c8e3a0b2d1e4c5b
        "400":
          description: Bad request, invalid data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                    description: The status of the response
                  error:
                    type: string
                    example: Invalid data provided
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                    description: The status of the response
                  error:
                    type: string
                    example: Internal Server Error

components:
  schemas:
    User:
      type: object
      properties:
        firstName:
          type: string
          description: The first name of the user
        lastName:
          type: string
          description: The last name of the user
        email:
          type: string
          description: The email address of the user
        password:
          type: string
          description: The password of the user
      example:
        firstName: John
        lastName: Doe
        email: johndoe@gmail.com
        password: password123
    UserCreate:
      type: object
      properties:
        _id:
          type: string
          description: The unique identifier for the user
        firstName:
          type: string
          description: The first name of the user
        lastName:
          type: string
          description: The last name of the user
        email:
          type: string
          description: The email address of the user
        password:
          type: string
          description: The password of the user
      example:
        firstName: John
        lastName: Doe
        email: johndoe@gmail.com
        password: password123